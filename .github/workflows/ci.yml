name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npx prettier --check src
      - run: npm run build
      - run: npm audit --omit=dev

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag node-tasks:ci
      - name: Smoke test the container
        run: |
          test "$(docker run --rm node-tasks:ci id -u)" != 0
          docker run -d --name smoke -p 127.0.0.1:3000:3000 \
            -e HOST=0.0.0.0 -e CRON_DB_PATH=/var/lib/crontab-ui \
            -e BASIC_AUTH_USER=u -e BASIC_AUTH_PWD=p node-tasks:ci
          for i in $(seq 30); do
            curl -fsu u:p http://127.0.0.1:3000/ >/dev/null && break
            sleep 2
          done
          curl -fsu u:p http://127.0.0.1:3000/ >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 401
          docker exec smoke sh -c "echo '* * * * * touch /tmp/cron-ran' | crontab -"
          for i in $(seq 45); do
            docker exec smoke test -f /tmp/cron-ran && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  config-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Report-only for now: the container still runs as root, which this scan flags.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  # Single required status check: passes only if every job above passed or was skipped.
  ci-passed:
    if: always()
    needs: [test, docker-build, dependency-review, workflow-lint, config-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
